version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: olist_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist_dw}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olist_user} -d ${POSTGRES_DB:-olist_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_analytics_app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-olist_dw}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs

volumes:
  postgres_data:
